# Pre-commit hooks for data-collector
# Install: pre-commit install -t pre-commit -t pre-push
# Run all: pre-commit run --all-files

repos:
  # Ruff - extremely fast Python linter (replaces flake8, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013]

  # Secret detection is betterleaks, run in CI (`.github/workflows/ci-public.yml`);
  # it needs no baseline file.

  # Type checking and tests - only on push (slower)
  - repo: local
    hooks:
      - id: ty
        name: ty type checking
        entry: uv run ty check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-unit
        name: pytest unit tests
        entry: uv run pytest tests/ -v --tb=short -x -m "not integration" --no-cov
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: bandit
        name: bandit security linter
        entry: uv run bandit -r src/ -ll -ii
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: pip-audit
        name: pip-audit security scan (uv-export → pip-audit)
        entry: scripts/pip-audit.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

ci:
  autofix_prs: false
  autoupdate_schedule: monthly
